name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    # The tests play two whole bot runs; a run that goes well lasts up to
    # twelve minutes of game time.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The version before the v8 upgrade stays downloadable for good. The
      # "spenn-latest" release still holds its APK (built from a4113e8 on
      # main) until this run replaces it further down, so it is copied to a
      # release of its own first, tagged at that commit. Done once.
      - name: Keep the original (v7.57) APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEEP=spenn-v7.57-original
          ORIGINAL=a4113e8cb8ddcf976c6f134dde20e75a4a2855e5
          # A failed lookup stops the build here: nothing may be built over
          # spenn-latest before the original is known to be safe.
          TAGS=$(gh release list --limit 100 --json tagName -q '.[].tagName')
          if grep -qx "$KEEP" <<<"$TAGS"; then
            echo "Already kept."
            exit 0
          fi
          if ! grep -qx spenn-latest <<<"$TAGS"; then
            echo "No spenn-latest release to keep a copy of."
            exit 0
          fi
          NOTES=$(gh release view spenn-latest --json body -q .body)
          case "$NOTES" in
            *"${ORIGINAL::7}"*) ;;
            *) echo "::warning::spenn-latest no longer holds the v7.57 build; nothing copied."; exit 0 ;;
          esac
          mkdir -p "$RUNNER_TEMP/original"
          gh release download spenn-latest -p spenn.apk -D "$RUNNER_TEMP/original"
          mv "$RUNNER_TEMP/original/spenn.apk" "$RUNNER_TEMP/original/spenn-v7.57-original.apk"
          gh release create "$KEEP" --target "$ORIGINAL" --latest=false \
            --title "Spenn v7.57 – originalen før oppgraderingen" \
            --notes "Spillet slik det var før den helhetlige oppgraderingen (v8). Bygget fra ${ORIGINAL::7}. Samme signatur som nyere bygg, så den kan installeres over dem (og omvendt) uten å miste lagret fremgang." \
            "$RUNNER_TEMP/original/spenn-v7.57-original.apk"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and Android export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="$GODOT_VERSION"
          BASE="https://github.com/godotengine/godot/releases/download/${V}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${V}-stable_export_templates.tpz"
          DEST=~/.local/share/godot/export_templates/${V}.stable
          mkdir -p "$DEST"
          # Only the Android templates are needed; keep the cache small.
          unzip -q /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d /tmp/tpl
          mv /tmp/tpl/templates/* "$DEST/"
          ls -la "$DEST"

      - name: Configure Android SDK for Godot
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          for f in editor_settings-4.3.tres editor_settings-4.tres; do
            cat > ~/.config/godot/$f <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          CFG
          done

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            ALIAS="$KEYSTORE_ALIAS"; PASS="$KEYSTORE_PASSWORD"
            echo "Using keystore from repository secrets."
          else
            ALIAS="spenn"; PASS="spenn-ci-key"
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Spenn CI, O=Spenn, C=NO"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set - signed with a throwaway key. Installs from different runs cannot update each other."
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Smoke test (headless boot)
        run: |
          set -euo pipefail
          ~/godot/godot --headless --path . --quit-after 120 2>&1 | tee /tmp/boot.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/boot.log; then exit 1; fi

      - name: Tests (session flow, saves, timing, physics, soak and bot runs)
        run: SEEDS="1 2" tools/tests/run.sh ~/godot/godot

      - name: Export signed APK
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot/godot --headless --path . --export-release "Android" build/spenn.apk
          test -s build/spenn.apk

      - name: Verify signature
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs build/spenn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: spenn-${{ github.sha }}
          path: build/spenn.apk
          if-no-files-found: error

      # A fixed link for phones: every push replaces spenn.apk on the
      # "spenn-latest" release, so the newest build is always at
      # releases/download/spenn-latest/spenn.apk (no zip, no Actions page).
      - name: Publish to the spenn-latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=spenn-latest
          NOTES="Siste bygg: ${GITHUB_SHA::7} fra ${GITHUB_REF_NAME}. Last ned spenn.apk og åpne den på telefonen."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Spenn – siste bygg" --notes "$NOTES"
          else
            gh release edit "$TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" build/spenn.apk --clobber
